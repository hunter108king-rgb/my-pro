<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    height: 100vh;
    overflow: hidden;
    background: radial-gradient(circle at center, #071d2b 0%, #02070b 45%, #000 100%);
    color: #00eaff;
    font-family: Arial, sans-serif;
}

.container {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

/* Top HUD */
.top {
    position: absolute;
    top: 30px;
    text-align: center;
}

.top h1 {
    font-size: 28px;
    letter-spacing: 8px;
    text-shadow: 0 0 15px #00eaff;
}

#status {
    margin-top: 10px;
    font-size: 13px;
    letter-spacing: 3px;
    color: #8cefff;
}

/* JARVIS CORE */
.core {
    width: 250px;
    height: 250px;
    border-radius: 50%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}

.core::before {
    content: "";
    position: absolute;
    width: 220px;
    height: 220px;
    border-radius: 50%;
    border: 2px solid #00eaff;
    box-shadow:
        0 0 15px #00eaff,
        inset 0 0 30px #00eaff;
    animation: pulse 2s infinite;
}

.core::after {
    content: "";
    position: absolute;
    width: 150px;
    height: 150px;
    border-radius: 50%;
    border: 3px dashed #00eaff;
    animation: rotate 8s linear infinite;
}

.inner {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: #00eaff;
    box-shadow:
        0 0 20px #00eaff,
        0 0 60px #00eaff,
        0 0 100px #008cff;
    animation: glow 1.5s infinite alternate;
}

.ring {
    position: absolute;
    width: 280px;
    height: 280px;
    border-radius: 50%;
    border: 1px solid rgba(0,234,255,.4);
    border-top: 3px solid #00eaff;
    animation: rotateReverse 5s linear infinite;
}

/* Buttons */
.controls {
    position: absolute;
    bottom: 50px;
    display: flex;
    gap: 15px;
}

button {
    padding: 13px 25px;
    border: 1px solid #00eaff;
    background: rgba(0,234,255,.08);
    color: #00eaff;
    border-radius: 5px;
    cursor: pointer;
    letter-spacing: 2px;
    box-shadow: 0 0 10px rgba(0,234,255,.3);
}

button:hover {
    background: #00eaff;
    color: #001018;
    box-shadow: 0 0 25px #00eaff;
}

/* Console */
.console {
    position: absolute;
    left: 30px;
    bottom: 30px;
    width: 300px;
    font-size: 12px;
    color: #65eaff;
    line-height: 1.8;
}

@keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

@keyframes rotateReverse {
    from { transform: rotate(360deg); }
    to { transform: rotate(0deg); }
}

@keyframes pulse {
    0%, 100% {
        transform: scale(1);
        opacity: .7;
    }
    50% {
        transform: scale(1.08);
        opacity: 1;
    }
}

@keyframes glow {
    from {
        transform: scale(.9);
        opacity: .7;
    }
    to {
        transform: scale(1.1);
        opacity: 1;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="top">
        <h1>J.A.R.V.I.S</h1>
        <div id="status">SYSTEM ONLINE</div>
    </div>

    <div class="core">
        <div class="ring"></div>
        <div class="inner"></div>
    </div>

    <div class="controls">
        <button onclick="startListening()">🎙 SPEAK</button>
        <button onclick="jarvis('time')">TIME</button>
        <button onclick="jarvis('youtube')">YOUTUBE</button>
    </div>

    <div class="console">
        > INITIALIZING SYSTEM...<br>
        > NEURAL CORE: ONLINE<br>
        > VOICE SYSTEM: READY<br>
        > JARVIS: AWAITING COMMAND...
    </div>

</div>

<script>

const statusText = document.getElementById("status");

/* Voice output */
function speak(text) {
    const voice = new SpeechSynthesisUtterance(text);

    voice.rate = 0.9;
    voice.pitch = 0.8;
    voice.volume = 1;

    speechSynthesis.cancel();
    speechSynthesis.speak(voice);

    statusText.textContent = "JARVIS SPEAKING...";
    
    voice.onend = () => {
        statusText.textContent = "SYSTEM ONLINE";
    };
}

/* Commands */
function jarvis(command) {

    if (command === "time") {
        const time = new Date().toLocaleTimeString();
        speak("Sir, the current time is " + time);
    }

    if (command === "youtube") {
        speak("Opening YouTube, sir.");

        setTimeout(() => {
            window.open("https://www.youtube.com", "_blank");
        }, 1200);
    }
}

/* Voice recognition */
function startListening() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        speak("Sorry sir. Voice recognition is not supported by this browser.");
        return;
    }

    const recognition = new SpeechRecognition();

    recognition.lang = "en-US";
    recognition.continuous = false;

    statusText.textContent = "LISTENING...";

    speak("I'm listening, sir.");

    setTimeout(() => {
        recognition.start();
    }, 700);

    recognition.onresult = function(event) {

        const command =
            event.results[0][0].transcript.toLowerCase();

        statusText.textContent = "COMMAND RECEIVED";

        console.log("Command:", command);

        if (command.includes("time")) {
            jarvis("time");
        }

        else if (
            command.includes("youtube") ||
            command.includes("open youtube")
        ) {
            jarvis("youtube");
        }

        else if (command.includes("hello")) {
            speak("Hello sir. How may I assist you?");
        }

        else if (command.includes("who are you")) {
            speak("I am your personal JARVIS interface.");
        }

        else {
            speak(
                "I heard you say " +
                command +
                ". However, I don't have a command for that yet."
            );
        }
    };

    recognition.onerror = function() {
        statusText.textContent = "SYSTEM ONLINE";
        speak("I couldn't hear you, sir.");
    };
}

/* Startup */
setTimeout(() => {
    speak("Good day, sir. JARVIS systems are online.");
}, 1000);

</script>

</body>
</html>
